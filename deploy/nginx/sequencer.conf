# Nginx site for the Mail Sequencer (Laravel + PHP-FPM).
# Copy to /etc/nginx/sites-available/sequencer.conf, adjust server_name / paths / socket, then
#   ln -s /etc/nginx/sites-available/sequencer.conf /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# TLS certificates: certbot --nginx -d app.example.com -d track.example.com

limit_req_zone $binary_remote_addr zone=sequencer_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com track.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com track.example.com;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # CSV uploads (SEQUENCER import max is 20 MB).
    client_max_body_size 25m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Never serve dotfiles (.env, .git ...).
    location ~ /\.(?!well-known).* { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Brute-force damping in front of Laravel's own throttles.
    location = /login { limit_req zone=sequencer_login burst=5 nodelay; try_files $uri /index.php?$query_string; }
    location = /api/v1/auth/login { limit_req zone=sequencer_login burst=5 nodelay; try_files $uri /index.php?$query_string; }

    # Tracking pixels / clicks must never be cached by a proxy.
    location ~ ^/track/ {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # or 127.0.0.1:9000 / app:9000 in Docker
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
