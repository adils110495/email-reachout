; Supervisor program for the app's queue worker (Leads sends, sequences, IMAP polling, Bulks).
; Copy to /etc/supervisor/conf.d/cold-email-worker.conf, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start cold-email-worker:*
; After every deploy:  php artisan queue:restart   (workers finish their current job and restart)
;
; Queues (QUEUE_CONNECTION=redis):
;   emails  - SendSequenceEmailJob and the Leads compose SendEmailJob
;   default - CheckIncomingRepliesJob (IMAP), ProcessBulkJob (verify/find/import/enroll/...), Finder jobs
; "emails" is listed first so sends are not stuck behind a long import.
;
; Duplicate sequence sends are impossible by design (row locks + UNIQUE(enrollment_id, sequence_step_id)),
; so more processes only add throughput.

[program:cold-email-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=emails,default --sleep=1 --tries=3 --timeout=120 --max-time=3600 --memory=512
directory=/var/www/html
user=www-data
numprocs=4
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=150           ; > --timeout so an in-flight SMTP call is never killed mid-send
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
