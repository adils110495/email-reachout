; PHP-FPM pool for the Mail Sequencer web tier: /etc/php/8.3/fpm/pool.d/sequencer.conf
; (Queue workers and the scheduler run under the PHP CLI, not FPM.)
[sequencer]
user = www-data
group = www-data
listen = /run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 60s

php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 25M
php_admin_value[memory_limit] = 256M
php_admin_flag[expose_php] = off

; Required extensions: pdo_mysql, mbstring, openssl, tokenizer, xml, ctype, json, bcmath,
; fileinfo, iconv, imap (PHP <= 8.3 bundled; PECL "imap" on 8.4+), pcntl (CLI workers).
; OPcache in production:
php_admin_value[opcache.enable] = 1
; Run "php artisan optimize" and reload FPM on every deploy when timestamps are not validated.
php_admin_value[opcache.validate_timestamps] = 0
